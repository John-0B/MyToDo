name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential git ffmpeg \
          libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
          libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
          zlib1g-dev libgstreamer1.0 gstreamer1.0-plugins-base \
          gstreamer1.0-plugins-good openjdk-17-jdk \
          autoconf automake libtool pkg-config cmake ninja-build unzip wget \
          libffi-dev libssl-dev libbz2-dev liblzma-dev libsqlite3-dev \
          ccache

    - name: Install buildozer
      run: pip install buildozer cython==0.29.36

    - name: Accept Android SDK licenses
      run: |
        mkdir -p /opt/android-sdk/licenses
        echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > /opt/android-sdk/licenses/android-sdk-license
        echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > /opt/android-sdk/licenses/android-sdk-preview-license

    - name: Set Android SDK path
      run: echo "ANDROID_HOME=/opt/android-sdk" >> $GITHUB_ENV

    - name: Build APK with Buildozer
      run: |
        yes | buildozer -v android debug
      env:
        ANDROID_HOME: /opt/android-sdk

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: mytodo-apk
        path: bin/*.apk
